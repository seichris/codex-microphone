name: Attention pairing validation

on:
  push:
    branches: [feat/attention-pairing-11]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked source for reproducible local validation
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: attention-pairing-source
          path: source.tar
          retention-days: 1
