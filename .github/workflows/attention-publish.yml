name: Publish verified attention source objects
on:
  push:
    branches: [feat/attention-pairing-11]
    paths:
      - '.github/attention-publish-*.b64'
      - '.github/workflows/attention-publish.yml'
permissions:
  contents: write
jobs:
  objects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify patch and publish immutable Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import lzma
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          REPO = 'seichris/codex-microphone'
          PATCH_SHA = 'a1eec39bd5bbe001378c3d32721ab99647a1f3f441966b2477bcee8b366c2def'
          TARGET_TREE = 'bb2d0bc2ab8733ea4a01fd5045df4d0596e0688c'

          def git(*args):
              return subprocess.check_output(['git', *args])

          payload_paths = [f'.github/attention-publish-{i}.b64' for i in range(1, 5)]
          packed = ''.join(Path(path).read_text() for path in payload_paths)
          patch = lzma.decompress(base64.b64decode(packed, validate=True))
          assert len(patch) == 226831 and hashlib.sha256(patch).hexdigest() == PATCH_SHA
          subprocess.run(['git', 'apply', '--index', '--binary', '-'], input=patch, check=True)
          # Discard the temporary transfer workflow and build-generated bytecode.
          subprocess.run(['git', 'rm', '-f', '--', *payload_paths,
              '.github/workflows/attention-publish.yml',
              'firmware/tests/__pycache__/run_wireless_capture_tests.cpython-313.pyc'], check=True)
          assert git('write-tree').decode().strip() == TARGET_TREE
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)

          # Publish immutable Git objects only. A separately authorized connector operation
          # will create the implementation commit and advance the feature branch.
          api = f'https://api.github.com/repos/{REPO}/git/'

          def post(endpoint, body):
              request = urllib.request.Request(api + endpoint,
                  data=json.dumps(body).encode(), method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          index = {}
          for line in git('ls-tree', '-r', '-z', TARGET_TREE).split(b'\0'):
              if not line:
                  continue
              metadata, path = line.split(b'\t', 1)
              mode, kind, sha = metadata.decode().split()
              index[path.decode()] = (mode, kind, sha)
          entries = []
          for raw in git('diff', '--cached', '--name-only', '--no-renames', '-z').split(b'\0'):
              if not raw:
                  continue
              path = raw.decode()
              if path not in index:
                  entries.append(dict(path=path, mode='100644', type='blob', sha=None))
                  continue
              mode, kind, sha = index[path]
              assert kind == 'blob'
              content = git('cat-file', 'blob', sha)
              result = post('blobs', dict(content=base64.b64encode(content).decode(), encoding='base64'))
              assert result['sha'] == sha, path
              entries.append(dict(path=path, mode=mode, type=kind, sha=sha))
          result = post('trees', dict(base_tree=git('rev-parse', 'HEAD^{tree}').decode().strip(), tree=entries))
          assert result['sha'] == TARGET_TREE
          print('PUBLISHED_TREE=' + TARGET_TREE)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Verified and published immutable implementation tree: `' + TARGET_TREE + '`.\n')
