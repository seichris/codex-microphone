name: Attention review source
on:
  push:
    branches: [feat/attention-pairing-11]
    paths: [.github/workflows/attention-review-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package exact Git history for local merge validation
        run: git bundle create /tmp/attention-source.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: attention-review-source
          path: /tmp/attention-source.bundle
          retention-days: 1
