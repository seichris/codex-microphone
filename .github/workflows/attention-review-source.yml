name: Publish verified attention integration objects
on:
  push:
    branches: [feat/attention-pairing-11]
    paths: [.github/workflows/attention-review-source.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify integration and publish immutable source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import lzma
          import os
          import subprocess
          import urllib.request

          API = 'https://api.github.com/repos/seichris/codex-microphone/git/'
          BASE = '88e6de914f33c77bcf3a8baf1834faa8fc4d6879'
          TARGET = '26eeabae510b5d4ec3924b7d8cb007316c585c15'
          def request(endpoint, body=None):
              req = urllib.request.Request(API + endpoint,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def git(*args):
              return subprocess.check_output(['git', *args])
          chunks = []
          for sha in ['a05ab7c884147655e6228f156a1b7ccb371155db',
                      '0c7512aae577f61e870902ee3cb77a2879d22a76']:
              blob = request('blobs/' + sha)
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              chunks.append(data)
          patch = lzma.decompress(base64.b64decode(b''.join(chunks), validate=True))
          assert len(patch) == 56982
          assert hashlib.sha256(patch).hexdigest() == '49c06f87c4b187e4c66c3c7c862889a5f607d255c858e066d3f164b00bba66e4'
          subprocess.run(['git', 'read-tree', '--reset', '-u', BASE], check=True)
          subprocess.run(['git', 'apply', '--index', '--binary', '-'], input=patch, check=True)
          assert git('write-tree').decode().strip() == TARGET
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['python3', 'scripts/check_no_secrets.py'], check=True)
          index = {}
          for item in git('ls-tree', '-r', '-z', TARGET).split(b'\0'):
              if not item:
                  continue
              metadata, path = item.split(b'\t', 1)
              mode, kind, sha = metadata.decode().split()
              assert mode != '120000', path
              index[path.decode()] = (mode, kind, sha)
          entries = []
          for raw in git('diff', '--cached', BASE, '--name-only', '--no-renames', '-z').split(b'\0'):
              if not raw:
                  continue
              path = raw.decode()
              if path not in index:
                  entries.append(dict(path=path, mode='100644', type='blob', sha=None))
                  continue
              mode, kind, sha = index[path]
              assert kind == 'blob'
              data = git('cat-file', 'blob', sha)
              result = request('blobs', dict(content=base64.b64encode(data).decode(), encoding='base64'))
              assert result['sha'] == sha, path
              entries.append(dict(path=path, mode=mode, type=kind, sha=sha))
          # The connector, not this job, creates the tree/commit and advances the branch.
          print('PUBLISHED_BLOBS_FOR_TREE=' + TARGET)
          print(json.dumps(entries))
