name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tracked files for credentials
        run: python scripts/check_no_secrets.py
      - name: Test the secret scanner
        run: python scripts/test_check_no_secrets.py
      - name: Check release version consistency
        run: python scripts/check_version.py

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - working-directory: bridge
        run: npm ci
      - working-directory: bridge
        run: npm test
      - working-directory: bridge
        run: npm run check

  provisioning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install esp-idf-kconfig==2.5.4
      - run: python scripts/test-wireless-provisioning.py

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the firmware LVGL baseline
        run: git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
      - name: Test firmware UI with real LVGL
        run: |
          cmake -S firmware/tests -B firmware/build/host-tests -DLVGL_SOURCE_DIR="$RUNNER_TEMP/lvgl"
          cmake --build firmware/build/host-tests --parallel 2
          ctest --test-dir firmware/build/host-tests --output-on-failure

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [v5.4.4, v5.5]
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP-IDF firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32s3
          path: firmware

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test dictation session and task draft routing
        run: swift test --package-path macos
      - name: Build menu-bar companion
        run: swift build --package-path macos --configuration release
